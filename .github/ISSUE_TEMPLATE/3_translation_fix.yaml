name: ✏️ Translation fix
description: Something in your language is wrong, awkward or sounds machine-translated
title: '[translation]: '
labels: ['🌐 translation', 'translation']
assignees: [trueberryless]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for pointing it out! Many of OpenDeck's translations were drafted with AI (Claude), so reports from people who speak the language are the best way to fix them. You don't need to know how to code.
  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        # sync:languages
        - Arabic (ar)
        - Balinese (ban)
        - Bengali (bn)
        - Bulgarian (bg)
        - Catalan (ca)
        - Central Kurdish (ckb)
        - Chinese (zh)
        - Croatian (hr)
        - Czech (cs)
        - Danish (da)
        - Dutch (nl)
        - Filipino (tl)
        - Finnish (fi)
        - French (fr)
        - German (de)
        - Greek (el)
        - Hebrew (he)
        - Hindi (hi)
        - Hungarian (hu)
        - Indonesian (id)
        - Italian (it)
        - Japanese (ja)
        - Korean (ko)
        - Malay (ms)
        - Norwegian (no)
        - Persian (fa)
        - Polish (pl)
        - Portuguese (pt)
        - Romanian (ro)
        - Russian (ru)
        - Samoan (sm)
        - Serbian (sr)
        - Slovak (sk)
        - Spanish (es)
        - Swahili (sw)
        - Swedish (sv)
        - Thai (th)
        - Turkish (tr)
        - Tuvaluan (tvl)
        - Ukrainian (uk)
        - Urdu (ur)
        - Vietnamese (vi)
        # /sync:languages
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Where is it?
      options:
        # sync:scopes
        - 'Interface: menus, buttons and messages (ui)'
        - 'Starter pack: Survival vocabulary (survival)'
        # /sync:scopes
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's wrong, and what should it say?
      description: Copy the current text, then write what a native speaker would say. A screenshot or the page you saw it on helps.
      placeholder: |
        Current: "Erneut"
        Better: "Nochmal"
        Seen on: the study screen, first answer button
    validations:
      required: true
