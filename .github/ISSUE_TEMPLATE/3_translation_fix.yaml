name: ✏️ Translation fix
description: Something in your language is wrong, awkward or sounds machine-translated
title: '[translation]: '
labels: ['🌐 translation', 'translation']
assignees: [trueberryless]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for pointing it out! You can fix strings yourself on the [review page](https://opendeck.space/translations/review), which fills in this form for you, or just describe the problem below. You don't need to know how to code.
  - type: input
    id: language
    attributes:
      label: Language
      placeholder: German (de)
    validations:
      required: true
  - type: textarea
    id: review
    attributes:
      label: Review
      description: Written by the review page. Leave it empty if you came here directly.
      render: json
  - type: textarea
    id: problem
    attributes:
      label: What's wrong, and what should it say?
      description: Copy the current text, then write what a native speaker would say. A screenshot or the page you saw it on helps.
      placeholder: |
        Current: "Erneut"
        Better: "Nochmal"
        Seen on: the study screen, first answer button
