name: 🌐 Translation review
description: Approve a translation file you read string by string on opendeck.space/translations/review
title: '[translation]: '
labels: ['🌐 translation', 'translation']
assignees: [trueberryless]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reviewing! 💛 This form is filled in by the [review page](https://opendeck.space/translations/review), where you compare every string with English, fix what sounds wrong and approve the file. Please start there instead of filling it in by hand.

        Once a maintainer approves it, a bot applies your changes in a pull request and credits you on [opendeck.space/translations](https://opendeck.space/translations).
  - type: textarea
    id: review
    attributes:
      label: Review
      description: Written by the review page. Please don't edit it.
      render: json
    validations:
      required: true
  - type: input
    id: credit
    attributes:
      label: Name for the credits (optional)
      description: Shown next to your GitHub username on opendeck.space/translations. Leave empty to show only your username.
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything you weren't sure about or couldn't fix in the review page.
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I read every string in this file, and with my changes it reads naturally to a native speaker. I'm happy for my name to be shown as the person who checked it.
          required: true
