name: Translation check

on:
  issues:
    types: [labeled]

concurrency:
  group: translation-check-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  record:
    if: github.event.label.name == 'translation-approved' && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Record the check
        id: record
        run: node scripts/record-translation-check.ts

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          TITLE: ${{ steps.record.outputs.title }}
        run: |
          branch="translation-check/issue-$ISSUE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add app/data/translation-verifications.json
          git commit -F "$RUNNER_TEMP/translation-check-commit.txt"
          git push --force origin "$branch"
          if gh pr view "$branch" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$branch" --title "$TITLE" --body-file "$RUNNER_TEMP/translation-check-body.md"
          else
            gh pr create --head "$branch" --title "$TITLE" --body-file "$RUNNER_TEMP/translation-check-body.md"
          fi
          pr=$(gh pr view "$branch" --json url --jq .url)
          gh issue comment "$ISSUE" --body "Thank you! 💛 Your check is recorded in $pr and will show on https://opendeck.space/translations once it is merged."

      - name: Report problems
        if: failure() && steps.record.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          {
            echo "The check could not be recorded automatically:"
            echo
            cat "$RUNNER_TEMP/translation-check-error.md"
            echo
            echo "Please edit the issue, then remove and re-add the \`translation-approved\` label."
          } > "$RUNNER_TEMP/comment.md"
          gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/comment.md"
