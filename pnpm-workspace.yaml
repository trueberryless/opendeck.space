# Allow only these packages to run install/build scripts (pnpm 10+ blocks by default).
allowBuilds:
  core-js: false
  esbuild: false
  vue-demi: true

# 4.0.0-20260929 adds a dev-close-sockets Nitro plugin that breaks `nuxt dev`
overrides:
  '@nuxt/cli': npm:@nuxt/cli-nightly@4.0.0-20260923-082744-ba05517
